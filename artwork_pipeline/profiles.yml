# =============================================================================
# profiles.yml -- Dual-mode dbt-snowflake connection profile
# =============================================================================
# This file works in TWO execution contexts:
#
#   1. LOCAL (Mac, dbt Core CLI):
#      - Target: `dev`
#      - Auth: key-pair (private_key_path via env_var)
#      - Connects as ARTWORK_TRANSFORMER_SVC service user
#      - Requires exported env vars from .env
#
#   2. SNOWFLAKE-NATIVE (workspace / CREATE DBT PROJECT / EXECUTE DBT PROJECT):
#      - Target: `snowflake`
#      - Auth: session-based (inherits the caller's Snowflake session)
#      - No credentials needed (account/user are placeholders)
#      - Role/warehouse/database set explicitly to avoid inheriting session defaults
#
# HOW TO USE:
#   Local:     dbt run --target dev        (or just `dbt run` since dev is default)
#   Snowflake: dbt run --target snowflake  (or set target: snowflake in workspace)
#
# DESIGN NOTES:
#   - `env_var()` is NOT available in Snowflake-native execution. Any target
#     used in that context must have all values hardcoded or use Snowflake session
#     defaults. The `snowflake` target hardcodes everything.
#   - The `dev` target uses env_var() for ALL secrets (key path, account, user)
#     because those vary per machine and must not be committed to version control.
#   - Both targets write to the same schemas (SILVER/GOLD) using the same role.
#     The generate_schema_name macro handles routing identically regardless of target.
#
# REQUIRED ENV VARS (dev target only, set in .env, exported by dbt_orchestrate.sh):
#   SNOWFLAKE_ACCOUNT, DBT_SNOWFLAKE_USER, DBT_SNOWFLAKE_PRIVATE_KEY_PATH,
#   SNOWFLAKE_DATABASE, SNOWFLAKE_WAREHOUSE
# OPTIONAL (dev target only, have defaults):
#   DBT_SNOWFLAKE_ROLE, DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
# =============================================================================

dbt_daniel:
  target: dev
  outputs:
    dev:
      type: snowflake
      threads: 16
      account: KUNHTEL-GL13131
      user: ARTWORK_TRANSFORMER_SVC
      database: ARTWORK_DB
      warehouse: ARTWORK_WH
      schema: DBT_DKALLEWARD
      role: ARTWORK_TRANSFORMER
      private_key_path: /Users/daniel/.snowflake/keys/gl13131_transformer_rsa_key.p8
