# =============================================================================
# packages.yml -- external dbt packages
# =============================================================================
# Run `dbt deps` after any change here.
#
# These packages serve different roles in the pipeline:
#
#   CORE UTILITIES
#     dbt_utils          -- Surrogate keys, date spines, generic tests, SQL helpers.
#                           Used in nearly every model (generate_surrogate_key).
#     codegen            -- Dev-time code generation (YAML stubs from existing tables,
#                           model SQL from source definitions). Not used at runtime.
#
#   DATA QUALITY & TESTING
#     dbt_expectations   -- 50+ statistical/shape tests (row count bounds, regex,
#                           distribution checks, cross-column validations). Extends
#                           dbt's built-in 4 tests with Great Expectations-style power.
#     audit_helper       -- Row-by-row, column-by-column comparison of two relations.
#                           Used during refactoring to prove output hasn't changed.
#
#   GOVERNANCE & OBSERVABILITY
#     dbt_project_evaluator -- DAG hygiene auditor. Checks naming conventions, model
#                           fanout, staging-from-source rules, documentation coverage.
#                           Creates queryable views showing violations.
#
# =============================================================================

packages:
  # --- Core utilities ---
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]

  - package: dbt-labs/codegen
    version: [">=0.14.0", "<0.15.0"]

  # --- Data quality & testing ---
  - package: metaplane/dbt_expectations
    version: [">=0.10.9", "<0.11.0"]
