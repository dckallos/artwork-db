# =============================================================================
# dbt_project.yml -- Artwork Medallion Pipeline
# =============================================================================
# Profile linkage: the `profile:` value must match the top-level key in
# profiles.yml (either ~/.dbt/profiles.yml or artwork_pipeline/profiles.yml).

name: artwork_pipeline
version: '1.0.0'
config-version: 2

profile: artwork_pipeline

# --- Paths ---
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# --- Global configs ---
# copy_grants prevents privilege loss on CREATE OR REPLACE (full-refresh).
# See Q5 research: FUTURE GRANTS do NOT re-fire on OR REPLACE; copy_grants
# preserves the prior object's grants.
models:
  artwork_pipeline:
    +copy_grants: true
    staging:
      +materialized: view
      +schema: SILVER
      met:
        +tags: ["met", "staging"]
    marts:
      +materialized: table
      +schema: GOLD
      +tags: ["marts"]

  # dbt_project_evaluator: package requires its staging/graph models to use
  # table materialization (enforced by check_model_is_table macro). Other models
  # use view to avoid permanent table sprawl.
  # Run with: dbt build --select package:dbt_project_evaluator
  dbt_project_evaluator:
    +materialized: table
    +schema: DBT_TEST__AUDIT

# --- dbt_project_evaluator configuration ---
# Defines naming conventions and thresholds for DAG hygiene checks.
# Docs: https://dbt-labs.github.io/dbt-project-evaluator/
vars:
  dbt_project_evaluator:
    # Naming prefixes expected per model type (our convention: stg_, dim_, fct_)
    model_types:
      - name: staging
        config:
          materialized: view
        folder: staging
        include_all_dag_nodes: false
        node_types:
          - model
      - name: mart
        config:
          materialized: table
        folder: marts
        include_all_dag_nodes: false
        node_types:
          - model

    # Models with fanout above this threshold are flagged
    models_fanout_threshold: 5

    # Documentation coverage: warn if below this % of models have descriptions
    documentation_coverage_target: 100
