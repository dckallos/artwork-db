# =============================================================================
# dbt_project.yml -- Artwork Medallion Pipeline
# =============================================================================

name: artwork_pipeline
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.8.0", "<2.0.0"]

profile: dbt_daniel

# --- Paths ---
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# --- Global configs ---
models:
  artwork_pipeline:
    +copy_grants: true
    staging:
      +materialized: view
      
      # The macro will see this 'SILVER' custom schema. 
      # Locally: It prepends the developer name (e.g., dbt_daniel_SILVER)
      # Snowflake: It uses it exactly as written (e.g., SILVER)
      +schema: SILVER
      
      met:
        +tags: ["met", "staging"]
      aic:
        +tags: ["aic", "staging"]
    marts:
      +materialized: table
      
      # The macro will see this 'GOLD' custom schema.
      +schema: GOLD
      
      +tags: ["marts"]

