# =============================================================================
# _met__sources.yml -- Bronze source declaration for Met Museum data
# =============================================================================
# The source() macro maps dbt to the physical BRONZE table so models can
# reference {{ source('met', 'raw_met_objects') }} without hardcoding schema.

version: 2

sources:
  - name: met
    description: "Met Museum OpenAccess data loaded by the extraction pipeline"
    database: ARTWORK_DB
    schema: BRONZE
    tables:
      - name: raw_met_objects
        description: >
          Raw enriched artwork records from the Met Museum. Each row has a
          VARIANT column (RAW_PAYLOAD) containing nested keys: csv (from the
          OpenAccess CSV), api_images (from the Met Objects API), and _meta
          (extraction metadata).
        identifier: RAW_MET_OBJECTS
        columns:
          - name: OBJECT_ID
            description: "Met API objectID (integer PK)"
            tests:
              - unique
              - not_null
          - name: RAW_PAYLOAD
            description: "Full VARIANT payload (csv + api_images + _meta)"
          - name: _EXTRACTED_AT
            description: "UTC timestamp when the row was extracted"
          - name: _SOURCE_SYSTEM
            description: "Source system identifier (always 'met_museum')"
          - name: _BATCH_ID
            description: "UUID of the extraction batch"

      - name: met_enrichment_control
        description: >
          Enrichment lifecycle control table. One row per Met objectID tracking
          discovery status, image-gate result, CDN liveness, the fetch lease, and
          last error. Source for stg_met__enrichment_status (Unit 3).
        identifier: MET_ENRICHMENT_CONTROL
        columns:
          - name: OBJECT_ID
            description: "Met objectID; join key to RAW_MET_OBJECTS / MET_CSV_SNAPSHOT"
            tests:
              - unique
              - not_null
          - name: ENRICHMENT_STATUS
            description: "Outcome enum: pending | done | no_image | error"
            tests:
              - not_null
          - name: HAS_PRIMARY_IMAGE
            description: "Monetization gate result (LEG-02 / IMG-02)"
          - name: IMAGE_STATUS
            description: "Liveness enum: unknown | live | dead (IMG-04)"
          - name: CLAIMED_BY_BATCH
            description: "Lease owner: batch_id currently fetching this row (NULL = free)"
