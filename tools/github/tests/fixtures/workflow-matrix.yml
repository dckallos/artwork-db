# Fixture: a matrix job (expands to one check context per combination) + the aggregate.
name: matrix-ci
on:
  pull_request: {}
jobs:
  unit:
    name: unit
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
  ci-required:
    runs-on: ubuntu-latest
    needs: [unit]
    if: always()
