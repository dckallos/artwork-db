# =============================================================================
# TEST FIXTURE ONLY -- a github-client config exercising `snowflake_secrets`.
# Tests load this, then repoint `secrets.source` at tests/fixtures/connections.toml
# (via dataclasses.replace) so no real ~/.snowflake file is read.
# =============================================================================
repo: octocat/hello-world

branch_protection:
  branches:
    main:
      policy: policies/policy.main.json
      required_checks_from_workflows: true

snowflake_secrets:
  source: connections.toml            # tests override this to the fixtures path
  profiles:
    staging:
      profile: artwork_ci_staging
      target: { type: environment, name: staging }
      map:
        account:   { variable: SNOWFLAKE_ACCOUNT }
        user:      { secret: DBT_SNOWFLAKE_USER }
        role:      { variable: DBT_SNOWFLAKE_ROLE }
        warehouse: { variable: SNOWFLAKE_WAREHOUSE }
      extra:
        DBT_SNOWFLAKE_PRIVATE_KEY:            { from_file: "keys/staging_ci.p8" }
        DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: { prompt: true }
      allow_roles: [ARTWORK_TRANSFORMER]
    admin:                            # ACCOUNTADMIN profile -> H3 reject
      profile: admin_conn
      target: { type: environment, name: prod }
      map:
        account: { variable: SNOWFLAKE_ACCOUNT }
        user:    { secret: DBT_SNOWFLAKE_USER }
      allow_roles: [ARTWORK_TRANSFORMER]
    oauth:                            # session profile -> H3 reject
      profile: oauth_conn
      target: { type: environment, name: staging }
      map:
        account: { variable: SNOWFLAKE_ACCOUNT }
      allow_roles: [ARTWORK_TRANSFORMER]
    human:                            # personal identity -> H3 reject when local_user matches
      profile: human_conn
      target: { type: environment, name: staging }
      map:
        account: { variable: SNOWFLAKE_ACCOUNT }
        role:    { variable: DBT_SNOWFLAKE_ROLE }
      allow_roles: [ARTWORK_TRANSFORMER]
    wrong_role_set:                   # role SYSADMIN not in allowlist -> H3 reject
      profile: wrong_role_conn
      target: { type: environment, name: staging }
      map:
        account: { variable: SNOWFLAKE_ACCOUNT }
      allow_roles: [ARTWORK_TRANSFORMER]
