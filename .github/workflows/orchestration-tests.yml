# =============================================================================
# orchestration-tests.yml -- unit + integration tests for the Dagster layer
# =============================================================================
# Offline: no Snowflake credentials required. Installs the orchestration package
# (which pulls Dagster + dbt-snowflake) into a venv, builds the dbt manifest with
# dbt parse, then runs pytest. Auth mapping, profile resolution, config/path wiring,
# manifest derivation, and the grep gate are all exercised without a live connection.
# =============================================================================
name: orchestration-tests

on:
  pull_request:
    paths:
      - "orchestration/**"
      - "artwork_pipeline/**"
      - ".github/workflows/orchestration-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "orchestration/**"
      - "artwork_pipeline/**"
      - ".github/workflows/orchestration-tests.yml"
  workflow_dispatch: {}

# Least privilege (H4): this workflow only needs to read the repo.
permissions:
  contents: read

# Per-workflow + ref concurrency (H4): cancel superseded in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      ARTWORK_REPO_ROOT: ${{ github.workspace }}
      DBT_TARGET: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install the orchestration package (editable)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e "orchestration[dev]"

      - name: Prepare dbt packages and manifest
        run: |
          . .venv/bin/activate
          dbt deps --project-dir artwork_pipeline --profiles-dir artwork_pipeline
          dbt parse \
            --project-dir artwork_pipeline \
            --profiles-dir artwork_pipeline \
            --target "$DBT_TARGET" \
            --no-partial-parse
          test -f artwork_pipeline/target/manifest.json

      - name: Run pytest
        # Clear PYTHONPATH so the installed package (not a stray sys.path entry) is
        # imported -- documented sandbox gotcha from issue #6.
        env:
          PYTHONPATH: ""
          ARTWORK_SKIP_DBT_PREPARE: "1"
        run: |
          . .venv/bin/activate
          pytest orchestration/tests
