# =============================================================================
# ci.yml -- PR checks for artwork-db, gated by the always-emitting `ci-required`.
# =============================================================================
# H2 fix (plan §2.2): this workflow triggers on EVERY pull request (no top-level
# `paths:` filter) and ends in a single aggregate job, `ci-required`, that always
# runs. Branch protection requires ONLY that aggregate context (set by
# `ghclient ci reconcile`) -- never a path-filtered job name -- so docs-only or
# tools/github-only PRs no longer deadlock waiting for a check that never emits.
#
# Path-specific, credentialed work (the dbt checks) is isolated in the `dbt-checks`
# job, which only runs when dbt-relevant paths change; `ci-required` treats a
# legitimately skipped job as success.
#
# Required GitHub Environment values for dbt-checks (environment: staging):
#   Variables: SNOWFLAKE_ACCOUNT, SNOWFLAKE_DATABASE, SNOWFLAKE_WAREHOUSE,
#              DBT_SNOWFLAKE_ROLE, DBT_TARGET
#   Secrets:   DBT_SNOWFLAKE_USER (dedicated low-privilege CI user, never ACCOUNTADMIN),
#              DBT_SNOWFLAKE_PRIVATE_KEY, DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE
#
# NOTE: no job here ever runs `ghclient ... --apply` (H4). GitHub-side required-check
# settings are managed out-of-band by a maintainer running `ghclient ci reconcile`.
# =============================================================================
name: dbt-ci

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Least privilege by default; individual jobs opt into more only if needed (H4).
permissions:
  contents: read

# Per-workflow + ref concurrency (never a blanket group): a newer push to the same
# ref cancels the older in-flight run (H4).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether dbt-relevant paths changed, so the credentialed job can be skipped
  # on docs-only / tooling-only PRs without deadlocking the required aggregate.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dbt: ${{ steps.filter.outputs.dbt }}
      orchestration: ${{ steps.filter.outputs.orchestration }}
      extraction: ${{ steps.filter.outputs.extraction }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${BASE_SHA:-$BEFORE_SHA}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Fail safe: if we cannot determine the base, run every path-gated job.
            echo "dbt=true" >> "$GITHUB_OUTPUT"
            echo "orchestration=true" >> "$GITHUB_OUTPUT"
            echo "extraction=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^(artwork_pipeline/|scripts/ci/|requirements\.txt$|profiles\.yml\.example$|config/github-client-config\.yml$|\.github/workflows/ci\.yml$|\.sqlfluff$)'; then
            echo "dbt=true" >> "$GITHUB_OUTPUT"
          else
            echo "dbt=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(orchestration/|artwork_pipeline/)'; then
            echo "orchestration=true" >> "$GITHUB_OUTPUT"
          else
            echo "orchestration=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(extraction/|scripts/ci/)'; then
            echo "extraction=true" >> "$GITHUB_OUTPUT"
          else
            echo "extraction=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint all workflow YAML (also runs shellcheck on embedded run: scripts).
  actionlint:
    runs-on: ubuntu-latest
    env:
      # Pin the actionlint version (C6): reproducible CI, no exposure to upstream drift.
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (pinned installer + version)
        shell: bash
        run: |
          # Fetch the installer from the matching *tagged* ref -- never `main` -- and pass
          # the explicit version so both the script and the binary are pinned (C6).
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
      - name: Run actionlint
        shell: bash
        run: ./actionlint -color

  # ShellCheck the standalone shell scripts (shellcheck is preinstalled on ubuntu).
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/*.sh scripts/**/*.sh tools/github/wrappers/*.sh)
          printf 'shellcheck: %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  # Installed-package smoke + offline unit/integration suite for the ghclient tool (H4).
  github-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/github/pyproject.toml
      - name: Install ghclient (editable, with dev extras)
        run: pip install -e "tools/github[dev]"
      - name: CLI smoke
        run: ghclient --help
      - name: Unit + integration tests (offline; PYTHONPATH cleared)
        env:
          PYTHONPATH: ""
        run: pytest tools/github/tests

  # Fast repo-wide Python gates: byte-compile + docstring house style.
  py-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the ghclient package
        run: python -m py_compile tools/github/ghclient/*.py
      - name: Docstring house style
        run: python3 scripts/normalize_docstrings.py --check

  # H7 authorship guard -- ADVISORY-first: reports markers but never blocks a merge
  # (it is intentionally NOT a dependency of ci-required). Promote to a required gate
  # only after the hardening in plan §13.1 H7 has soaked. Needs full history to
  # resolve the PR base ref, hence fetch-depth: 0.
  authorship-guard:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for automated AI-authorship markers (advisory)
        shell: bash
        run: bash scripts/check_no_attribution.sh

  # Path-specific, credentialed dbt checks -- only when dbt paths changed.
  dbt-checks:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    # Environment-scoped secrets/variables are published by ghclient secrets publish.
    # deployment: false grants access without creating a deployment record.
    environment:
      name: staging
      deployment: false
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE || 'ARTWORK_DB' }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_ROLE: ${{ vars.DBT_SNOWFLAKE_ROLE }}
      DBT_TARGET: ${{ vars.DBT_TARGET || 'staging' }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/ci_rsa_key.p8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlfluff sqlfluff-templater-dbt
      - name: Write private key from secret
        env:
          DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printf '%s' "$DBT_SNOWFLAKE_PRIVATE_KEY" > "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
      - name: Run CI checks (compile + lint + unit tests)
        run: bash scripts/ci/ci_local.sh

  # Offline Dagster-layer unit + integration tests -- folded in from the former standalone
  # orchestration-tests.yml (C1) so the always-emitting aggregate actually depends on it.
  # Path-gated via the `changes` job (orchestration/** or artwork_pipeline/**); no creds.
  orchestration-tests:
    needs: changes
    if: needs.changes.outputs.orchestration == 'true'
    runs-on: ubuntu-latest
    env:
      ARTWORK_REPO_ROOT: ${{ github.workspace }}
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create venv and install the orchestration package (editable)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e "orchestration[dev]"
      - name: Prepare dbt packages and manifest
        run: |
          . .venv/bin/activate
          dbt deps --project-dir artwork_pipeline --profiles-dir artwork_pipeline
          dbt parse \
            --project-dir artwork_pipeline \
            --profiles-dir artwork_pipeline \
            --target "$DBT_TARGET" \
            --no-partial-parse
          test -f artwork_pipeline/target/manifest.json
      - name: Run pytest
        # Clear PYTHONPATH so the installed package (not a stray sys.path entry) is
        # imported -- documented sandbox gotcha from issue #6.
        env:
          PYTHONPATH: ""
          ARTWORK_SKIP_DBT_PREPARE: "1"
        run: |
          . .venv/bin/activate
          pytest orchestration/tests

  # The single always-emitting required context (H2). Depends on every gating job and
  # succeeds unless one of them failed or was cancelled; a legitimately skipped job
  # (e.g. dbt-checks on a docs-only PR) does not fail the aggregate.
  ci-required:
    name: ci-required
    needs: [changes, actionlint, shellcheck, github-client, py-quality, dbt-checks, orchestration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gating jobs passed (skipped is allowed)
        shell: bash
        env:
          RESULTS: >-
            ${{ needs.changes.result }}
            ${{ needs.actionlint.result }}
            ${{ needs.shellcheck.result }}
            ${{ needs.github-client.result }}
            ${{ needs.py-quality.result }}
            ${{ needs.dbt-checks.result }}
            ${{ needs.orchestration-tests.result }}
            ${{ needs.extraction-tests.result }}
        run: |
          echo "gating job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were legitimately skipped."
          