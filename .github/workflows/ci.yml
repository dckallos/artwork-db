# =============================================================================
# ci.yml -- PR checks for the artwork dbt project (checks-only)
# =============================================================================
# Runs the SAME steps as scripts/ci/ci_local.sh. While the project is in
# local-only development this workflow is inert until you push to GitHub and
# add the SNOWFLAKE_* / key-pair secrets below. It does NOT run a full
# `dbt build` (no dev/prod isolation yet), so it never writes to prod schemas.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   SNOWFLAKE_ACCOUNT
#   DBT_SNOWFLAKE_USER               (e.g. ARTWORK_TRANSFORMER_SVC)
#   DBT_SNOWFLAKE_PRIVATE_KEY        (full PEM contents of the .p8 key)
#   DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE  (optional; "" if none)
# =============================================================================
name: dbt-ci

on:
  pull_request:
    paths:
      - "artwork_pipeline/**"
      - "scripts/ci/**"
      - ".sqlfluff"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_DATABASE: ARTWORK_DB
      SNOWFLAKE_WAREHOUSE: ARTWORK_WH
      DBT_SNOWFLAKE_ROLE: ARTWORK_TRANSFORMER
      # dbt's key-pair auth reads the key from a file path.
      DBT_SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/ci_rsa_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlfluff sqlfluff-templater-dbt

      - name: Write private key from secret
        run: |
          printf '%s' "${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}" > "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"
          chmod 600 "$DBT_SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: Run CI checks (compile + lint + unit tests)
        run: bash scripts/ci/ci_local.sh
