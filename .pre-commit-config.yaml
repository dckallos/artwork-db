# =============================================================================
# .pre-commit-config.yaml -- local commit-time guardrails
# =============================================================================
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
# =============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        # The dbt templater needs the adapter installed alongside sqlfluff.
        additional_dependencies:
          - dbt-snowflake
          - sqlfluff-templater-dbt

  # dbt parse as a fast structural check (no warehouse writes).
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse
        entry: bash -c 'dbt parse --project-dir artwork_pipeline --profiles-dir artwork_pipeline'
        language: system
        pass_filenames: false
        files: ^artwork_pipeline/.*\.(sql|yml|yaml)$

      # House-style docstrings (CODE_STANDARDS.md section 8): triple quotes each on their
      # own line. Opt-in (manual stage) while the existing tree is normalized incrementally,
      # so it never blocks an unrelated commit. Run on demand:
      #   pre-commit run --hook-stage manual normalize-docstrings --all-files
      # or directly:  python3 scripts/normalize_docstrings.py --check  (--write to fix)
      - id: normalize-docstrings
        name: normalize docstrings (house style)
        entry: python3 scripts/normalize_docstrings.py --check
        language: system
        types: [python]
        stages: [manual]
